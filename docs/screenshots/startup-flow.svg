<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="820" viewBox="0 0 1760 820" role="img" aria-labelledby="title desc">
  <title id="title">Tools for Steam console startup flow</title>
  <desc id="desc">Five steps show how Tools for Steam starts before Explorer, prepares the background host, hides the desktop, and attaches to Steam Big Picture.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1722"/>
      <stop offset="1" stop-color="#132131"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152333"/>
      <stop offset="1" stop-color="#0f1925"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#213448" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#102030" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#62c5ff" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1760" height="820" fill="url(#page)"/>
  <path d="M80 68h1560" stroke="#315674" stroke-width="3" opacity="0.8"/>
  <g transform="translate(22 28)">
    <g>
      <rect x="0" y="0" width="328" height="764" rx="24" fill="url(#panel)" stroke="#315674" stroke-width="2"/>
      <circle cx="42" cy="34" r="18" fill="#0b1420" stroke="#315674" stroke-width="6"/>
      <text x="34" y="82" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#62c5ff">01</text>
      <text x="250" y="82" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#91a6ba" letter-spacing="2">BOOT</text>
      <text x="34" y="136" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#f2f6fb">PC starts</text>
      <text x="34" y="250" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">The living room PC</text>
      <text x="34" y="290" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">boots and hands control</text>
      <text x="34" y="330" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">over to the startup</text>
      <text x="34" y="370" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">chain.</text>
      <rect x="34" y="576" width="260" height="226" rx="20" fill="url(#glass)" stroke="#315674" opacity="0.92" filter="url(#glow)"/>
      <path d="M164 664a54 54 0 1051 34M164 664l14 0M215 698l-35 12" fill="none" stroke="#62c5ff" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(352 4)">
      <rect x="0" y="0" width="330" height="760" rx="24" fill="url(#panel)" stroke="#315674" stroke-width="2"/>
      <circle cx="42" cy="34" r="18" fill="#0b1420" stroke="#315674" stroke-width="6"/>
      <text x="34" y="82" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#62c5ff">02</text>
      <text x="225" y="82" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#91a6ba" letter-spacing="2">LAUNCH</text>
      <text x="34" y="136" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#f2f6fb">TFS launches first</text>
      <text x="34" y="254" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">The tray app starts</text>
      <text x="34" y="294" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">early, keeping setup</text>
      <text x="34" y="334" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">logic ready before Big</text>
      <text x="34" y="374" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">Picture takes over.</text>
      <rect x="34" y="576" width="260" height="226" rx="20" fill="url(#glass)" stroke="#315674" opacity="0.92" filter="url(#glow)"/>
      <rect x="62" y="688" width="204" height="98" rx="16" fill="#101d2a" stroke="#243f59"/>
      <text x="86" y="734" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#dce8f2">TFS</text>
      <text x="86" y="764" font-family="Arial, sans-serif" font-size="20" fill="#8fa7bd">Tray app ready</text>
    </g>
    <g transform="translate(704 8)">
      <rect x="0" y="0" width="330" height="756" rx="24" fill="url(#panel)" stroke="#315674" stroke-width="2"/>
      <circle cx="42" cy="34" r="18" fill="#0b1420" stroke="#315674" stroke-width="6"/>
      <text x="34" y="82" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#62c5ff">03</text>
      <text x="250" y="82" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#91a6ba" letter-spacing="2">HOST</text>
      <text x="34" y="136" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#f2f6fb">Windows</text>
      <text x="34" y="174" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#f2f6fb">background host</text>
      <text x="34" y="212" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#f2f6fb">comes online</text>
      <text x="34" y="294" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">The local background</text>
      <text x="34" y="334" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">layer exposes the</text>
      <text x="34" y="374" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">bridge and keeps the</text>
      <text x="34" y="414" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">utility responsive.</text>
      <rect x="34" y="576" width="260" height="226" rx="20" fill="url(#glass)" stroke="#315674" opacity="0.92" filter="url(#glow)"/>
      <rect x="66" y="634" width="154" height="22" rx="11" fill="#244258"/>
      <rect x="66" y="674" width="124" height="22" rx="11" fill="#1e3549"/>
      <rect x="66" y="714" width="178" height="22" rx="11" fill="#1c3144"/>
    </g>
    <g transform="translate(1056 10)">
      <rect x="0" y="0" width="330" height="754" rx="24" fill="url(#panel)" stroke="#315674" stroke-width="2"/>
      <circle cx="42" cy="34" r="18" fill="#0b1420" stroke="#315674" stroke-width="6"/>
      <text x="34" y="82" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#62c5ff">04</text>
      <text x="218" y="82" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#91a6ba" letter-spacing="2">CLEANUP</text>
      <text x="34" y="136" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#f2f6fb">Desktop icons and</text>
      <text x="34" y="174" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#f2f6fb">taskbar are hidden</text>
      <text x="34" y="282" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">Before the final handoff,</text>
      <text x="34" y="322" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">TFS clears the regular</text>
      <text x="34" y="362" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">Windows desktop so</text>
      <text x="34" y="402" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">Big Picture becomes</text>
      <text x="34" y="442" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">the visible front layer.</text>
      <rect x="34" y="576" width="260" height="226" rx="20" fill="url(#glass)" stroke="#315674" opacity="0.92" filter="url(#glow)"/>
      <rect x="60" y="626" width="210" height="160" rx="12" fill="#102030" opacity="0.85"/>
      <rect x="82" y="650" width="24" height="24" rx="6" fill="#2f5872"/>
      <rect x="116" y="650" width="24" height="24" rx="6" fill="#213c52"/>
      <rect x="82" y="690" width="24" height="24" rx="6" fill="#345f7a"/>
      <rect x="116" y="690" width="24" height="24" rx="6" fill="#1f394f"/>
      <rect x="82" y="730" width="24" height="24" rx="6" fill="#3c6b88"/>
      <rect x="116" y="730" width="24" height="24" rx="6" fill="#1f394f"/>
    </g>
    <g transform="translate(1408 0)">
      <rect x="0" y="0" width="330" height="764" rx="24" fill="url(#panel)" stroke="#315674" stroke-width="2"/>
      <circle cx="42" cy="34" r="18" fill="#0b1420" stroke="#315674" stroke-width="6"/>
      <text x="34" y="82" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#62c5ff">05</text>
      <text x="230" y="82" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#91a6ba" letter-spacing="2">ATTACH</text>
      <text x="34" y="136" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#f2f6fb">Big Picture opens</text>
      <text x="34" y="174" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#f2f6fb">with TFS attached</text>
      <text x="34" y="250" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">By the time Steam fills</text>
      <text x="34" y="290" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">the TV, Quick Access</text>
      <text x="34" y="330" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">already has the Tools</text>
      <text x="34" y="370" font-family="Arial, sans-serif" font-size="26" fill="#9eb4c8">for Steam bridge.</text>
      <rect x="34" y="576" width="260" height="226" rx="20" fill="url(#glass)" stroke="#315674" opacity="0.92" filter="url(#glow)"/>
      <rect x="60" y="634" width="84" height="116" rx="14" fill="#16283a"/>
      <rect x="168" y="634" width="84" height="116" rx="14" fill="#172c3f"/>
      <rect x="194" y="680" width="54" height="18" rx="9" fill="#274a64"/>
      <rect x="194" y="714" width="54" height="18" rx="9" fill="#24445d"/>
      <rect x="194" y="748" width="54" height="18" rx="9" fill="#203c54"/>
    </g>
  </g>
</svg>
