<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tools for Steam PresentMon Bridge</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070c;
      color: #d3d8e6;
      display: grid;
      place-items: center;
    }

    .panel {
      width: min(420px, calc(100vw - 32px));
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(18, 24, 36, 0.92);
      border: 1px solid rgba(132, 164, 255, 0.18);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.35);
    }

    .title {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #f4f7ff;
    }

    .status {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      color: #b4bfd8;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1 class="title">Tools for Steam Performance Bridge</h1>
    <p id="status" class="status">Booting bridge...</p>
  </main>
  <script src="./bridge.js"></script>
</body>
</html>
